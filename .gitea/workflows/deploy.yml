name: CI/CD

on:
    push:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: https://gitea.com/actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Check versions
              run: |
                node -v
                bun -v

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

    cd:
        needs: ci
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t qr-app:latest .

            - name: Remove old container
              run: docker rm -f qr-app || true

            - name: Run container
              run: |
                  docker run -d \
                    --name qr-app \
                    --restart unless-stopped \
                    -p 3002:3002 \
                    qr-app:latest
